            ranchoelmacho/packages/bootstrap/js/bootstrap-carousel.js \
            ranchoelmacho/packages/bootstrap/js/bootstrap-carousel.min.js \
            ranchoelmacho/packages/fancybox/jquery.fancybox.min.css \
            ranchoelmacho/packages/fancybox/jquery.fancybox.min.js
          do
            f="$root/$p"
            if [ ! -e "$f" ]; then
              echo "already absent : $p"
            elif [ -d "$f" ]; then
              # Defensive: this list is files only. Never recurse a directory.
              echo "SKIPPED (dir)  : $p"
              failed=1
            elif rm -f -- "$f"; then
              echo "removed        : $p"
            else
              echo "FAILED         : $p"
              failed=1
            fi
          done
          # Directories are never touched by the list above (it is files only,
          # and a directory in it is a hard error). But a directory left empty
          # after its files go still answers /path/ — nginx serves 403 for a
          # dir with no index, not the 404 we want. So empty parents are
          # cleaned up here with rmdir, which REFUSES a non-empty directory:
          # this can never delete something still being served. Non-fatal by
          # design — same rules otherwise, exact relative paths, no globs.
          for d in \
            resume \
            ranchoelmacho/packages/bootstrap/css \
            ranchoelmacho/packages/bootstrap/js \
            ranchoelmacho/logs/traffic.html \
            ranchoelmacho/macho/stills \
            ranchoelmacho/macho/stills-thumbs \
            ranchoelmacho/macho/stills-thumbs-super \
            ranchoelmacho/packages/bootstrap \
            ranchoelmacho/packages/fancybox \
            ranchoelmacho/css \
            ranchoelmacho/js \
            ranchoelmacho/logs \
            ranchoelmacho/macho \
            ranchoelmacho/packages
          do
            f="$root/$d"
            if [ ! -e "$f" ]; then
              echo "already absent : $d/"
            elif rmdir -- "$f" 2>/dev/null; then
              echo "removed empty  : $d/"
            else
              echo "kept, NOT empty: $d/"
            fi
          done
          exit "$failed"
          REMOTE

      - name: purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}

  deploy-staging:
    runs-on: ubuntu-24.04
    needs: [jekyll-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Download build result
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Setup SSH Keys and known_hosts
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan ssh.nickwalker.us >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"

      - name: 🚀 deploy to staging
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: rsync -havz --delete ./ www-data@ssh.nickwalker.us:/var/www/testing.alexwalker.co/ --exclude=/.well-known

      - name: purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}
