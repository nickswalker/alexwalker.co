name: Build and Deploy

on:
  push:
    branches:
      - master
      - develop
  # When the IG sync workflow commits new posts via GITHUB_TOKEN, the
  # resulting push doesn't trigger this workflow — GitHub blocks
  # bot-pushed events from chaining workflows to prevent infinite loops.
  # Listen for the sync workflow's completion so the new
  # _data/instagram.yml ships to live without a manual nudge.
  workflow_run:
    workflows: ["Sync Instagram Stills"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  jekyll-build:
    runs-on: ubuntu-latest
    # workflow_run fires on both success and failure. Skip the deploy chain
    # entirely if the sync didn't actually succeed — no point shipping a
    # broken sync (or worse, a partial commit) to the live site.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 📂 set up
        uses: actions/checkout@v4
        with:
          # Full history (not the default shallow depth=1). Required so
          # the file_mtime Liquid filter in _plugins/file_mtime.rb can
          # find the last commit that touched each file (e.g. the
          # "Gear List - Updated <month>" button on the homepage reads
          # git log -1 for img/AlexWalker_fullgearlist.pdf). With a
          # shallow clone, git log returns empty for any file that
          # wasn't changed in the very latest commit, and the filter
          # would fall through to File.mtime — which in CI is the
          # checkout instant, advancing the displayed month every push.
          fetch-depth: 0

      - name: 💎 set up ruby
        uses: ruby/setup-ruby@v1
        with:
          # Match the .ruby-version pinned by local development. Bundler is
          # resolved from Gemfile.lock by setup-ruby when bundler-cache is on,
          # so no explicit bundler pin is needed here.
          ruby-version: 3.3.6
          bundler-cache: true     # bundle install + caches /vendor/bundle

      - name: 🔨 build site
        run: bundle exec jekyll build

      - name: cache HTMLProofer
        id: cache-htmlproofer
        uses: actions/cache@v4
        with:
          path: tmp/.htmlproofer
          key: ${{ runner.os }}-htmlproofer-v2

      - name: run tests
        run: |
          bundle exec htmlproofer ./_site \
            --only-4xx \
            --assume-extension .html \
            --no-enforce-https \
            --ignore-missing-alt \
            --ignore-files '/_site/admin/,/_site/cinemaxxing-preview\.html/,/_site/cinemaxxing-filtered\.html/,/_site/cinemaxxing-advance\.html/' \
            --ignore-urls '/vimeo\.com/,/twitter\.com/,/instagram\.com/,/letterboxd\.com/,/fonts\.googleapis\.com/,/fonts\.gstatic\.com/,/nexus\.tail1c6f41\.ts\.net/,/imdb\.com/,/image\.tmdb\.org/,/cinemaxxing\.co/,/cinemark\.com/,/fandango\.com/,/amctheatres\.com/,/texaslegacyinlights\.com/' \
            --swap-urls 'https?\:\/\/alexwalker\.co:' \
            --cache '{ "timeframe": { "external": "30d" } }'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: [jekyll-build]
    # Deploy to live on:
    #  - direct pushes to master
    #  - manual workflow_dispatch runs (defaults to master in the UI)
    #  - successful runs of the Sync Instagram Stills workflow (which
    #    targets master). workflow_run events report github.ref as the
    #    default branch, so the original push branch check would always
    #    pass — make it explicit.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run'
    steps:
      - name: Download build result
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Setup SSH Keys and known_hosts
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan ssh.nickwalker.us >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"

      - name: 🚀 deploy
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: rsync -havz * www-data@ssh.nickwalker.us:/var/www/alexwalker.co/

      # The production rsync above deliberately has NO --delete (staging does).
      # That means deleting a file from this repo never unpublishes it: the
      # copy already on the server keeps returning 200 forever. Adding --delete
      # is NOT the fix — production may hold intentionally server-only files
      # that exist nowhere in this repo, and the flag would erase them
      # silently. Instead, this step removes an explicit, hand-maintained list
      # of paths that must no longer be served. It runs before the Cloudflare
      # purge below so any edge-cached copies are flushed in the same deploy.
      #
      # RULES for this list: exact relative paths only — never a glob, never a
      # directory. Add a path here at the same time you `git rm` the file.
      # Removing a path from this list is harmless once the file is gone.
      # A second, separate list below rmdirs directories left EMPTY by the
      # first — see the comment there; it is not an exception to these rules.
      - name: 🧹 unpublish removed documents
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          ssh www-data@ssh.nickwalker.us 'sh -s' <<'REMOTE'
          set -u
          root=/var/www/alexwalker.co
          failed=0
          # NOTE: img/AlexWalker_fullgearlist.pdf (no path suffix) is the
          # CURRENT gear list — it is still in the repo, in the sitemap, and
          # republished by Nexus's equipment publisher. It must NEVER appear
          # in this list. Only the _march2024 variant and the css/ copy go.
          for p in \
            img/Chapman_MiniScope_Factsheet.pdf \
            img/Full_Gear_Inventory.pdf \
            img/Main_Pelican_1510_Complete_Inventory.pdf \
            img/Main_Pelican_1510_Complete_Inventory_Nov25_2019.pdf \
            img/Media_Archive.pdf \
            img/Media_Archive072620.pdf \
            img/AlexWalker_fullgearlist_march2024.pdf \
            css/AlexWalker_fullgearlist.pdf \
            img/AlexWalker_fullgearlist.txt \
            resume/index.html \
            resume/resume.css \
            resume/custom-style.css
          do
            f="$root/$p"
            if [ ! -e "$f" ]; then
              echo "already absent : $p"
            elif [ -d "$f" ]; then
              # Defensive: this list is files only. Never recurse a directory.
              echo "SKIPPED (dir)  : $p"
              failed=1
            elif rm -f -- "$f"; then
              echo "removed        : $p"
            else
              echo "FAILED         : $p"
              failed=1
            fi
          done
          # Directories are never touched by the list above (it is files only,
          # and a directory in it is a hard error). But a directory left empty
          # after its files go still answers /path/ — nginx serves 403 for a
          # dir with no index, not the 404 we want. So empty parents are
          # cleaned up here with rmdir, which REFUSES a non-empty directory:
          # this can never delete something still being served. Non-fatal by
          # design — same rules otherwise, exact relative paths, no globs.
          for d in \
            resume
          do
            f="$root/$d"
            if [ ! -e "$f" ]; then
              echo "already absent : $d/"
            elif rmdir -- "$f" 2>/dev/null; then
              echo "removed empty  : $d/"
            else
              echo "kept, NOT empty: $d/"
            fi
          done
          exit "$failed"
          REMOTE

      - name: purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [jekyll-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Download build result
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Setup SSH Keys and known_hosts
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan ssh.nickwalker.us >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"

      - name: 🚀 deploy to staging
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: rsync -havz --delete ./ www-data@ssh.nickwalker.us:/var/www/testing.alexwalker.co/ --exclude=/.well-known

      - name: purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}
