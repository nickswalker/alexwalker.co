# Stills kept OUT of the homepage tile shuffle.
#
# A still listed here stops appearing in the rotating thumbnail on the
# Narrative / Commercial grids. It stays exactly where it is in the LIGHTBOX
# gallery — the lightbox reads its own frame lists (js/lightbox.js and
# _data/tll.yml) and nothing here touches them. Nothing is deleted, and no
# derivative is generated for an excluded still, so it costs zero page weight.
#
# THE IDENTIFIER IS THE STILL'S SOURCE PATH, copied verbatim from
# js/lightbox.js (or _data/tll.yml for Texas Legacy in Lights). A leading
# slash is optional. Use the ORIGINAL path under img/ — never an
# img/shuffle/... path, which is a generated crop.
#
# To find the path for a still: open the tile's lightbox, note which still it
# is (1st, 2nd, …), and read that entry out of the `frames:` list for that
# tile's key in js/lightbox.js.
#
# Example — this would drop the 3rd House of Abraham still and the 2nd
# Everyday Dose still from the rotation:
#
# exclude_from_shuffle:
#   - img/hoa/frame3.jpg
#   - img/commercial/everydaydose/frame2.jpg
#
# The build warns on stderr if a path here matches no still, so a typo can't
# fail silently. Re-run `python3 scripts/build_thumb_shuffle.py` after editing.
#
# A tile needs at least 2 stills to shuffle; if exclusions take it below that
# it simply stops rotating and keeps its authored thumbnail.

exclude_from_shuffle:
  # Chosen by Alex from the running demo, 2026-09-05. Each of these stays in
  # its lightbox gallery — this list only removes it from the tile rotation.
  - img/attad/frame2.jpg     # ECU bearded man, face left, pale wall right
  - img/jr/frame2.jpg        # saloon, woman in red lace laughing
  - img/goh/frame3.jpg       # night pool party, string lights
  - img/amorsui/frame2.jpg   # two women outdoors, freckles
  - img/alit/frame4.jpg      # near-mono, dark bob in a doorway
  - img/alit/frame2.jpg      # platinum wig, cigarette holder
  - img/amorsui/frame3.jpg   # wet hand on hexagonal shower tile
  - img/jr/frame3.jpg        # ECU older bearded man in wide-brimmed hat

  # Second pass, 2026-09-05. Both stay in their lightbox galleries.
  # NOTE: these take Amor Sui and A Life In Technicolor down to ONE eligible
  # still each — below the 2-still minimum — so both tiles stop rotating and
  # keep their authored thumbnail. That is the documented fallback, not a bug.
  - img/amorsui/frame4.jpg   # therapy two-shot, striped blazer vs. white sofa
  - img/alit/frame3.jpg      # mono, three-arm ceiling light and a stein

  # Third pass, 2026-09-06. Stays in the AppLovin lightbox gallery.
  # There are two phone-screen frames in this tile and only THIS one goes:
  # frame1 is the tight insert — nothing but two hands and the lit screen,
  # no face, no body. frame3 (the long-haired figure holding a phone up in
  # front of her face) is the other one and it STAYS: it has a person in it
  # and reads as a shot rather than a product insert.
  - img/comm_applovin/frame1.jpg  # ECU hands holding a phone, bright game screen

  # Fourth pass, 2026-09-06. Stays in the Texas Legacy in Lights lightbox
  # gallery. Texas Legacy in Lights keeps 7 eligible stills and goes on
  # rotating.
  - img/tll/frame3.jpg       # hand in a yellow gingham sleeve pressed into ash

  # Not a still from the piece: a photograph of the finished install (hotel
  # lobby, LED wall running his footage). It belongs in the Bostin Westin
  # lightbox next to the video, but it is architecture, not cinematography,
  # so it must never rotate into a homepage tile.
  - img/comm_bostin/lobby-led-wall.jpg

  # Fifth pass, 2026-09-07. Both stay in their lightbox galleries.
  #
  # A Christmas in New Hope keeps 3 eligible stills and goes on rotating.
  # NOTE: this frame is also the ACINH half of the only pair in
  # _data/shuffle_never_adjacent.yml. Excluding it here means that pair can
  # never bind — see the note kept alongside the rule there.
  - img/acinh/frame2.jpg     # cream cowboy hat, shearling jacket, guitar between the trees

  # Javelina Run's other two stills (frame2, frame3) went in the first pass,
  # so this takes it to ONE eligible still, img/jr/frame4.jpg. To keep the
  # tile rotating rather than freezing on its authored thumbnail, `jr` is
  # opted in to _data/shuffle_thumb_pool.yml — same fix as amorsui — so the
  # pool is frame4 plus the authored img/narrative/JRtrailer.jpg.
  - img/jr/frame1.jpg        # three men in cowboy hats standing in a doorway

  # Sixth pass, 2026-09-10. Stays in the Javelina Run lightbox gallery.
  # This is the LAST of Javelina Run's four lightbox stills, so the tile's
  # pool drops to one — the authored thumbnail alone — and it stops rotating
  # and keeps img/narrative/JRtrailer.jpg as a static src. That is the
  # documented fallback and it is the intended outcome here: the authored
  # thumbnail is a weapon-free close-up. See the note on `jr` in
  # _data/shuffle_thumb_pool.yml.
  - img/jr/frame4.jpg        # man firing a revolver on the western street, muzzle smoke across frame
