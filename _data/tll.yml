# list in either consumer.

title: Texas Legacy in Lights
url: /texas-legacy-in-lights/
subline: "Director of Photography · Directed by John Franklin Rinehart · Gonzales Memorial Museum, Gonzales, Texas"

paragraphs:
  - "A live-action film projected onto the limestone facade of the Gonzales Memorial Museum — believed to be the first permanent projection-mapped narrative film of its kind. It runs twice nightly across a surface roughly 96 by 32 feet, about one and a half times the width of an IMAX screen."
  - "Shot over seven days with five Blackmagic URSA Cine 12K LF bodies rolling simultaneously to cover a single continuous take, with a PYXIS 6K as B camera, capturing in 12K to hold detail at architectural scale."

official_site: "https://texaslegacyinlights.com"
official_site_label: "Visit the official project site"

