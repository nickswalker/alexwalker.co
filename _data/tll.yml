# Texas Legacy in Lights — ONE source of truth.
#
# There is deliberately NO standalone page for this project. Everything below
# renders into the home page's existing lightbox, and nothing else:
#   1. index.html — Jekyll writes the prose into the hidden `#tll` .rich-copy
#      block at build time, so the words are real DOM text in index.html on
#      disk (crawlable, present before any JS runs). The lightbox clones that
#      node; it never rebuilds the copy from JavaScript.
#   2. js/lightbox.js — RICH_CONFIG.tll (the still list only). That file
#      carries empty front matter so Jekyll runs Liquid over it and `frames`
#      below generates the strip.
# Add or reorder a still here and both surfaces follow. Don't hard-code the
# copy or the list in either consumer.

title: Texas Legacy in Lights
# Home-page deep link. The tile is a real <a href="#tll"> and the open
# lightbox puts this in the address bar — there is no separate URL to point at.
url: "#tll"
subline: "Directed by John Franklin Rinehart · Cinematography by Alex Walker · Gonzales Memorial Museum, Gonzales, Texas"

paragraphs:
  - "A live-action film projected onto the limestone facade of the Gonzales Memorial Museum — believed to be the first permanent projection-mapped narrative film of its kind. It runs twice nightly across a surface roughly 96 by 32 feet, about one and a half times the width of an IMAX screen."
  - "Shot over seven days with five Blackmagic URSA Cine 12K LF bodies and a PYXIS 6K as B camera. All rolling at 12K to hold detail at architectural scale."

official_site: "https://texaslegacyinlights.com"
official_site_label: "Visit the official project site"

# Blackmagic Design's press release about the shoot. Optional — index.html
# only renders the second button when press_url is set, so clearing these two
# keys drops it and leaves the official-site link alone.
#
# NOTE FOR FUTURE AGENTS AND LINK CHECKERS: this URL is GOOD — Alex confirmed
# it loads in a real browser (2026-09-06). Automated fetchers get a soft-404:
# curl returns HTTP 200 but the body is the generic "Media | Blackmagic
# Design" index, not the release. htmlproofer runs --only-4xx so a 200 passes,
# which is why the domain is NOT on the --ignore-urls list in
# .github/workflows/ci.yaml. If a checker ever does start reporting 4xx here,
# add /blackmagicdesign\.com/ to that list the way texaslegacyinlights.com and
# imdb.com already are. Do NOT "fix" or delete this URL because a tool says
# it's dead — it isn't.
press_url: "https://www.blackmagicdesign.com/media/release/20260723-01"
press_label: "Read more on blackmagicdesign.com"

# Home-page narrative tile (index.html). A crop of frame5.
tile_alt: "Texas Legacy in Lights — a rider on horseback gallops through the woods at dusk"

